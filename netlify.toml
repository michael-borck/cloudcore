[build]
  publish = "_site"
  command = "echo 'Build handled by GitHub Actions'"

[build.environment]
  NODE_VERSION = "18"

# Function settings
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Redirect rules for admin interface
[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/admin/:splat"
  status = 200

# API routes for admin functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Headers for security
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache control
[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "*.json"
  [headers.values]
    Cache-Control = "public, max-age=300"

# Environment variables (set these in Netlify dashboard)
# GITHUB_TOKEN - Personal access token with repo permissions
# GITHUB_OWNER - Your GitHub username (michael-borck)
# GITHUB_REPO - Repository name (cloudcore)
# UC_TOKENS - JSON string of unit coordinator tokens
# ADMIN_TOKEN - Master admin token

# Rate limiting (requires Netlify Pro)
# [[edge_functions]]
#   function = "rate-limit"
#   path = "/admin/login"