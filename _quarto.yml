project:
  type: website
  post-render: scripts/scrub-public-build.py
  # The render list includes the gated sections (docs/, chatbots/), but the
  # post-render scrub DELETES them from the output unless GATED_BUILD=1 is
  # set (scripts/build-site.sh sets it for the VPS build only). A bare
  # `quarto render` or `quarto publish` therefore always produces the safe
  # public build. Quarto merges profile render arrays, so excludes cannot be
  # un-done per profile — the scrub is the enforcement point, not this list.
  render:
    - "!CLAUDE.md"
    - "!CODE_OF_CONDUCT.md"
    - "!CONTRIBUTING.md"
    - "!README.md"
    - "!docs/access-demo.qmd"
    - "!docs/staged-content-example.qmd"
    - "!docs/registry.qmd"
    # Design docs. scenario-analysis.md was MISSING from this list and was
    # therefore rendered and published — it names the breach specifics and
    # lists the designed teaching scenarios. The client-side gate is a
    # deliberate teaching artefact, but the render boundary is the real one:
    # anything genuinely private must not be rendered at all.
    - "!scenario-analysis.md"
    - "!_instructor"
    - "*"

