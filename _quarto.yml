          <script src="/scripts/booking-modal.js"></script>
          <script src="/scripts/chatbot-booking.js"></script>
          <script src="/scripts/educational-notice.js"></script>

# NB: files excluded from render are still COPIED into _site as resources
# unless negated here too — without these, the public build would publish the
# raw gated .qmd/.md sources verbatim.
resources:
  - admin/
  - CNAME
  - scripts/
  - data/
  - "!docs/**"
  - "!chatbots/**"



