<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CloudCore Admin</title>
  <script src="/scripts/available.js"></script>
  <script src="/scripts/password.js"></script>
  <script src="/scripts/unit-access.js"></script>
  <script>
    // Redirect to simple CMS after authentication
    document.addEventListener('DOMContentLoaded', function() {
      // Check if user has admin access
      const unitAccess = getUnitAccess();
      if (unitAccess && unitAccess.unit === 'info-security-audit') {
        // Admin authenticated, redirect to CMS
        window.location.href = '/admin/simple-cms.html';
      }
    });
  </script>
</head>
<body>
  <h1>Admin Access Required</h1>
  <p>Authenticating...</p>
</body>
</html>
