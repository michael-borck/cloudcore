backend:
  name: github
  repo: michael-borck/cloudcore
  branch: main
  site_domain: cloudcore.serveur.au
  
media_folder: "assets/uploads"
public_folder: "/assets/uploads"

# Configure the CMS UI
site_url: https://cloudcore.serveur.au
display_url: https://cloudcore.serveur.au
logo_url: https://cloudcore.serveur.au/assets/cloudcore_networks.png

collections:
  # Scenarios for different units
  - name: "scenarios"
    label: "📚 Learning Scenarios"
    folder: "docs/scenarios"
    create: true
    slug: "{{slug}}"
    preview_path: "docs/scenarios/{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Unit", name: "unit", widget: "select", options: [
          {label: "Cybersecurity Basics", value: "cybersecurity-basics"},
          {label: "Incident Response", value: "incident-response"},
          {label: "Web Development", value: "web-development"},
          {label: "Systems Analysis", value: "systems-analysis"}
        ]}
      - {label: "Type", name: "categories", widget: "select", options: ["Article", "Case Study", "Exercise", "Lab"]}
      - {label: "Difficulty", name: "difficulty", widget: "select", options: ["Beginner", "Intermediate", "Advanced"]}
      - {label: "Description", name: "description", widget: "text"}
      - {label: "Publish Date", name: "date", widget: "datetime"}
      - {label: "Content", name: "body", widget: "markdown"}

  # Security incidents and breach scenarios  
  - name: "incidents"
    label: "🚨 Security Incidents"
    folder: "docs/articles"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Incident Type", name: "categories", widget: "select", options: ["Data Breach", "Malware", "Phishing", "Insider Threat", "DDoS"]}
      - {label: "Severity", name: "severity", widget: "select", options: ["Low", "Medium", "High", "Critical"]}
      - {label: "Date", name: "date", widget: "datetime"}
      - {label: "Description", name: "description", widget: "text"}
      - {label: "Incident Details", name: "body", widget: "markdown"}

  # Mock interviews
  - name: "interviews"  
    label: "🎤 Character Interviews"
    folder: "docs/interviews"
    create: true
    slug: "interview_{{slug}}"
    fields:
      - {label: "Interviewee Name", name: "title", widget: "string"}
      - {label: "Role", name: "role", widget: "string"}
      - {label: "Interview Context", name: "context", widget: "select", options: ["Pre-breach", "During incident", "Post-breach", "General security"]}
      - {label: "Date", name: "date", widget: "datetime"}
      - {label: "Description", name: "description", widget: "text"}
      - {label: "Interview Transcript", name: "body", widget: "markdown"}

  # Company policies
  - name: "policies"
    label: "📋 Company Policies"  
    folder: "docs/policies"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Policy Title", name: "title", widget: "string"}
      - {label: "Document Number", name: "doc_number", widget: "string", pattern: ["DOC-[A-Z]+-[0-9]+", "Must match pattern DOC-XXX-000"]}
      - {label: "Version", name: "version", widget: "string", default: "1.0"}
      - {label: "Category", name: "categories", widget: "select", options: ["Security", "Compliance", "HR", "IT", "Data Management"]}
      - {label: "Effective Date", name: "date", widget: "datetime"}
      - {label: "Description", name: "description", widget: "text"}
      - {label: "Policy Content", name: "body", widget: "markdown"}

  # Blog posts
  - name: "blog"
    label: "📝 Blog Posts"
    folder: "blog/posts"
    create: true
    path: "{{slug}}/index"
    media_folder: ""
    public_folder: ""
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Author", name: "author", widget: "string"}
      - {label: "Date", name: "date", widget: "datetime"}
      - {label: "Categories", name: "categories", widget: "list"}
      - {label: "Featured Image", name: "image", widget: "image", required: false}
      - {label: "Description", name: "description", widget: "text"}
      - {label: "Content", name: "body", widget: "markdown"}