<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudCore Admin</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            padding: 40px;
            max-width: 500px;
            text-align: center;
        }

        .logo { font-size: 64px; margin-bottom: 20px; }

        h1 { color: #333; margin-bottom: 10px; font-size: 32px; }

        .subtitle { color: #666; font-size: 18px; margin-bottom: 30px; }

        .btn {
            display: inline-block;
            padding: 14px 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102,126,234,0.4);
        }

        .features {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px solid #eee;
            text-align: left;
        }

        .features h3 { color: #333; margin-bottom: 15px; }

        .features ul {
            color: #666;
            line-height: 1.8;
            padding-left: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">☁️</div>
        <h1>CloudCore Admin</h1>
        <p class="subtitle">Lecturer Dashboard</p>

        <a href="login.html" class="btn">Sign In</a>

        <div class="features">
            <h3>Features</h3>
            <ul>
                <li>Manage unit settings and passwords</li>
                <li>Configure content visibility rules</li>
                <li>Set consultant and auditor access dates</li>
                <li>Upload unit-specific files</li>
            </ul>
        </div>
    </div>

    <script src="cloudcore-api.js"></script>
    <script>
        // Auto-redirect if already logged in
        const session = CloudCoreAPI.init();
        if (session) {
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
