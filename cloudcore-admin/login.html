<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudCore Lecturer Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            padding: 40px;
            max-width: 450px;
            width: 100%;
            text-align: center;
        }

        .logo {
            font-size: 48px;
            margin-bottom: 20px;
        }

        .title {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
            font-weight: 600;
        }

        .subtitle {
            color: #666;
            font-size: 16px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-weight: 500;
            margin-bottom: 8px;
            color: #495057;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e9ecef;
            border-radius: 6px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-bottom: 15px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102,126,234,0.4);
        }

        .login-btn:disabled {
            opacity: 0.6;
            transform: none;
            cursor: not-allowed;
        }

        .forgot-link {
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        .error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .info-panel {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
            text-align: left;
        }

        .info-panel h4 {
            color: #495057;
            margin-bottom: 10px;
        }

        .info-panel p {
            color: #6c757d;
            font-size: 14px;
            line-height: 1.4;
            margin-bottom: 8px;
        }

        .loading {
            display: none;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Forgot password form (hidden by default) */
        .forgot-form {
            display: none;
        }

        .back-link {
            color: #6c757d;
            text-decoration: none;
            font-size: 14px;
            display: inline-block;
            margin-top: 15px;
        }

        .back-link:hover {
            color: #667eea;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">🔐</div>
        <h1 class="title">Lecturer Login</h1>
        <p class="subtitle">Access your unit management dashboard</p>

        <div id="messages"></div>

        <!-- Login Form -->
        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" placeholder="your.email@university.edu" required>
            </div>

            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="login-btn" id="loginBtn">
                <span class="loading">
                    <span class="spinner"></span>
                    Signing in...
                </span>
                <span class="default-text">Sign In</span>
            </button>

            <a href="#" class="forgot-link" onclick="showForgotForm(); return false;">Forgot password?</a>
        </form>

        <!-- Forgot Password Form -->
        <form id="forgotForm" class="forgot-form">
            <div class="form-group">
                <label for="resetEmail">Email:</label>
                <input type="email" id="resetEmail" placeholder="your.email@university.edu" required>
            </div>

            <button type="submit" class="login-btn" id="forgotBtn">
                <span class="loading">
                    <span class="spinner"></span>
                    Sending...
                </span>
                <span class="default-text">Send Reset Code</span>
            </button>

            <a href="#" class="back-link" onclick="showLoginForm(); return false;">← Back to login</a>
        </form>

        <!-- Reset Password Form -->
        <form id="resetForm" class="forgot-form">
            <div class="form-group">
                <label for="resetCode">Reset Code:</label>
                <input type="text" id="resetCode" placeholder="6-digit code from email" required maxlength="6">
            </div>

            <div class="form-group">
                <label for="newPassword">New Password:</label>
                <input type="password" id="newPassword" placeholder="Minimum 8 characters" required minlength="8">
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password:</label>
                <input type="password" id="confirmPassword" placeholder="Confirm new password" required>
            </div>

            <button type="submit" class="login-btn" id="resetBtn">
                <span class="loading">
                    <span class="spinner"></span>
                    Resetting...
                </span>
                <span class="default-text">Reset Password</span>
            </button>

            <a href="#" class="back-link" onclick="showLoginForm(); return false;">← Back to login</a>
        </form>

        <div class="info-panel">
            <h4>For Lecturers:</h4>
            <p>• Manage your unit's content and access controls</p>
            <p>• Configure visibility rules for students</p>
            <p>• Upload course materials</p>
            <p>• Set release dates for content</p>
        </div>
    </div>

    <script src="cloudcore-api.js"></script>
    <script>
        let resetEmail = '';

        // Check if already logged in
        const session = CloudCoreAPI.init();
        if (session) {
            showMessage('Already logged in. Redirecting...', 'success');
            setTimeout(() => {
                window.location.href = 'dashboard.html';
            }, 1000);
        }

        // Login form handler
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            toggleLoading('loginBtn', true);

            try {
                const lecturer = await CloudCoreAPI.login(email, password);
                showMessage(`Welcome, ${lecturer.name}! Redirecting...`, 'success');

                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1000);

            } catch (error) {
                showMessage(error.message, 'error');
            }

            toggleLoading('loginBtn', false);
        });

        // Forgot password form handler
        document.getElementById('forgotForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            resetEmail = document.getElementById('resetEmail').value;
            toggleLoading('forgotBtn', true);

            try {
                await CloudCoreAPI.forgotPassword(resetEmail);
                showMessage('If an account exists, a reset code has been sent to your email.', 'success');

                // Show reset form
                setTimeout(() => {
                    showResetForm();
                }, 1500);

            } catch (error) {
                showMessage(error.message, 'error');
            }

            toggleLoading('forgotBtn', false);
        });

        // Reset password form handler
        document.getElementById('resetForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const code = document.getElementById('resetCode').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (newPassword !== confirmPassword) {
                showMessage('Passwords do not match', 'error');
                return;
            }

            toggleLoading('resetBtn', true);

            try {
                await CloudCoreAPI.resetPassword(resetEmail, code, newPassword);
                showMessage('Password reset successful! You can now log in.', 'success');

                setTimeout(() => {
                    showLoginForm();
                }, 2000);

            } catch (error) {
                showMessage(error.message, 'error');
            }

            toggleLoading('resetBtn', false);
        });

        function showLoginForm() {
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('forgotForm').style.display = 'none';
            document.getElementById('resetForm').style.display = 'none';
            document.querySelector('.title').textContent = 'Lecturer Login';
            document.querySelector('.subtitle').textContent = 'Access your unit management dashboard';
            document.getElementById('messages').innerHTML = '';
        }

        function showForgotForm() {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('forgotForm').style.display = 'block';
            document.getElementById('resetForm').style.display = 'none';
            document.querySelector('.title').textContent = 'Reset Password';
            document.querySelector('.subtitle').textContent = 'Enter your email to receive a reset code';
            document.getElementById('messages').innerHTML = '';
        }

        function showResetForm() {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('forgotForm').style.display = 'none';
            document.getElementById('resetForm').style.display = 'block';
            document.querySelector('.title').textContent = 'Enter Reset Code';
            document.querySelector('.subtitle').textContent = 'Check your email for the 6-digit code';
            document.getElementById('messages').innerHTML = '';
        }

        function showMessage(message, type) {
            const messagesDiv = document.getElementById('messages');
            messagesDiv.innerHTML = `<div class="${type}">${message}</div>`;

            if (type === 'success') {
                setTimeout(() => {
                    messagesDiv.innerHTML = '';
                }, 5000);
            }
        }

        function toggleLoading(btnId, isLoading) {
            const btn = document.getElementById(btnId);
            const loading = btn.querySelector('.loading');
            const defaultText = btn.querySelector('.default-text');

            if (isLoading) {
                loading.style.display = 'inline';
                defaultText.style.display = 'none';
                btn.disabled = true;
            } else {
                loading.style.display = 'none';
                defaultText.style.display = 'inline';
                btn.disabled = false;
            }
        }

        // Auto-focus email field
        document.getElementById('email').focus();
    </script>
</body>
</html>
