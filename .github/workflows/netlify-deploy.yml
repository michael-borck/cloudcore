name: Build and Deploy to Netlify
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          # No R installation needed for HTML-only site
          tinytex: false

      - name: Check for R dependencies
        id: check-r
        run: |
          if find . -name "*.qmd" -exec grep -l "```{r" {} \; | head -1; then
            echo "r_needed=true" >> $GITHUB_OUTPUT
          else
            echo "r_needed=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup R (only if needed)
        if: steps.check-r.outputs.r_needed == 'true'
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.2'

      - name: Install R dependencies (only if needed)
        if: steps.check-r.outputs.r_needed == 'true'
        run: |
          if [ -f "renv.lock" ]; then
            R -e "install.packages('renv'); renv::restore()"
          elif [ -f "_requirements.txt" ]; then
            R -e "install.packages(readLines('_requirements.txt'))"
          fi

      - name: Render Quarto site
        run: quarto render

      - name: List output directory
        run: |
          echo "Contents of _site directory:"
          ls -la _site/ || echo "No _site directory found"
          echo "Checking for alternative output directories:"
          find . -name "index.html" -not -path "./.git/*" -not -path "./node_modules/*"

      - name: Deploy to Netlify (Production)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: netlify/actions/cli@master
        with:
          args: deploy --dir=_site --prod --message "Deploy from GitHub Actions (commit ${{ github.sha }})"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      - name: Deploy to Netlify (Preview)
        if: github.event_name == 'pull_request'
        uses: netlify/actions/cli@master
        with:
          args: deploy --dir=_site --message "Preview deploy from PR #${{ github.event.number }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      - name: Comment PR with deploy URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `
            ## 🚀 Deploy Preview Ready!
            
            Your changes have been deployed to a preview URL.
            Check the Netlify deploy logs for the preview URL.
            
            **Commit:** ${{ github.sha }}
            **Preview build:** ✅ Successful
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });